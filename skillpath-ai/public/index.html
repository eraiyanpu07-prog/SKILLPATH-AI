<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKILLPATH AI – Discover Your Skills. Predict Your Gaps. Engineer Your Future.</title>
  <meta name="description" content="AI-powered personalized career learning platform featuring a collaborative council of 6 specialized autonomous AI agents, dynamic Career Twin, Skill DNA analysis, and the adaptive Learning Rescue System.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300F2FE'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/animations.css">
  <style>
    @media (max-width: 768px) {
      .hide-mobile {
        display: none !important;
      }
      aside {
        width: 60px !important;
        padding: 10px 4px !important;
      }
      aside button span span, aside div:last-child {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Rendered dynamically by SkillPathApp -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;">
      <div style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid rgba(6, 182, 212, 0.2); border-top-color: #00F2FE; animation: spin 1s infinite linear;"></div>
      <div style="font-size: 1.1rem; font-weight: 700; color: #38BDF8;">Initializing SkillPath AI Council...</div>
    </div>
  </div>

  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
